<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to Resume Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Layout */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .left-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #2d2d2d;
            padding: 20px;
            box-sizing: border-box;
            gap: 15px;
            border-right: 2px solid #000;
        }
        .right-pane {
            flex: 1;
            background-color: #f0f0f0;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            /* Flex centering removed to prevent overflow clipping */
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: #3d3d3d;
            padding: 15px;
            border-radius: 8px;
            color: white;
        }
        button, input[type="file"]::file-selector-button {
            padding: 8px 16px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover, input[type="file"]::file-selector-button:hover {
            background-color: #004494;
        }
        input[type="file"] {
            color: white;
        }
        .toggle-label {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
        }

        /* Editor */
        #editor {
            flex-grow: 1;
            width: 100%;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }

        /* Resume Container */
        #resume-wrapper {
            margin: 0 auto; /* Centers wrapper horizontally */

            --resume-width: 210mm;
            --hr-margin: 10px;
            --font-base: 11pt;
            --font-h1: 24pt;
            --font-h2: 14pt;
            --font-h3: 12pt;
            --font-family: 'Bookerly', 'Georgia', 'Times New Roman', serif;
            --line-height: 1.5;
            --page-padding: 20mm;

            background-color: white;
            width: var(--resume-width);
            min-height: 297mm;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            box-sizing: border-box;
            padding: var(--page-padding);
            font-family: var(--font-family);
            font-size: var(--font-base);
            line-height: var(--line-height);
            color: #000;
        }

        /* Page Break Visualizer */
        #resume-wrapper.show-page-breaks {
            background-image: linear-gradient(
                    to bottom,
                    transparent calc(297mm - 2px),
                    #ff4d4d calc(297mm - 2px),
                    #ff4d4d 297mm
            );
            background-size: 100% 297mm;
        }

        /* Typography & Layout */
        #resume-content h1 { font-size: var(--font-h1); text-align: center; margin-top: 0; margin-bottom: 5px; font-weight: normal; }
        #resume-content h2 { font-size: var(--font-h2); border-bottom: 1px solid #000; padding-bottom: 2px; margin-top: 15pt; margin-bottom: 8pt; text-transform: uppercase; }
        #resume-content h3 { font-size: var(--font-h3); margin-top: 10pt; margin-bottom: 2pt; }
        #resume-content p { margin-top: 0; margin-bottom: 8pt; }
        #resume-content ul { margin-top: 2pt; margin-bottom: 8pt; padding-left: 20pt; }
        #resume-content li { margin-bottom: 3pt; }
        #resume-content hr { border: none; border-top: 1px solid #000; margin-top: var(--hr-margin); margin-bottom: var(--hr-margin); }
        #resume-content a { color: #000; text-decoration: underline; }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            margin-bottom: 4px;
        }

        /* Print setup */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            .left-pane {
                display: none !important;
            }
            .right-pane {
                display: block !important;
                padding: 0 !important;
                overflow: visible !important;
                background: none !important;
            }
            #resume-wrapper {
                box-shadow: none !important;
                width: 100% !important;
                min-height: auto !important;
                margin: 0 !important;
                padding: var(--page-padding) !important;
                background-image: none !important;
            }
            .right-pane .controls {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Pane: Editor -->
    <div class="left-pane">
        <div class="controls">
            <input type="file" id="md-file" accept=".md,text/markdown">
            <button id="render-btn">Render</button>
            <button id="download-md-btn">Download MD</button>
            <button id="download-pdf-btn">Save as PDF</button>
            <label class="toggle-label">
                <input type="checkbox" id="page-break-toggle" checked> Show Page Breaks
            </label>
        </div>
        <textarea id="editor" placeholder="Write your markdown here or upload a file..."></textarea>
    </div>

    <!-- Right Pane: Output -->
    <div class="right-pane">
        <div id="resume-wrapper" class="show-page-breaks">
            <div id="resume-content">
                <h1 style="color: #888; text-align: center; margin-top: 50px;">Rendered Output Will Appear Here</h1>
            </div>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('md-file');
    const editor = document.getElementById('editor');
    const renderBtn = document.getElementById('render-btn');
    const downloadMdBtn = document.getElementById('download-md-btn');
    const downloadPdfBtn = document.getElementById('download-pdf-btn');
    const pageBreakToggle = document.getElementById('page-break-toggle');
    const resumeContent = document.getElementById('resume-content');
    const resumeWrapper = document.getElementById('resume-wrapper');

    const STORAGE_KEY = 'resume_md_content';

    const defaultConfig = {
        width: '210mm',
        hrMargin: '10px',
        fontBase: '11pt',
        fontH1: '24pt',
        fontH2: '14pt',
        fontH3: '12pt',
        fontFamily: "'Bookerly', 'Georgia', 'Times New Roman', serif",
        lineHeight: '1.5',
        pagePadding: '20mm'
    };

    // Toggle visual page breaks
    pageBreakToggle.addEventListener('change', (e) => {
        if (e.target.checked) {
            resumeWrapper.classList.add('show-page-breaks');
        } else {
            resumeWrapper.classList.remove('show-page-breaks');
        }
    });

    function parseConfigAndMarkdown(text) {
        const config = { ...defaultConfig };
        let cleanText = text;

        const frontmatterMatch = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n/) || text.match(/^<!--\s*([\s\S]*?)\s*-->/);

        if (frontmatterMatch) {
            const configBlock = frontmatterMatch[1];
            cleanText = text.replace(frontmatterMatch[0], '');

            configBlock.split('\n').forEach(line => {
                const [key, ...valParts] = line.split(':');
                if (key && valParts.length) {
                    const k = key.trim().toLowerCase();
                    const v = valParts.join(':').trim();

                    if (k === 'resume-width' || k === 'width') config.width = v;
                    if (k === 'hr-margin' || k === 'margin-hr' || k === 'hr vertical margin') config.hrMargin = v;
                    if (k === 'font-size-base' || k === 'font-base' || k === 'font-size') config.fontBase = v;
                    if (k === 'font-size-h1' || k === 'font-h1' || k === 'h1-size') config.fontH1 = v;
                    if (k === 'font-size-h2' || k === 'font-h2' || k === 'h2-size') config.fontH2 = v;
                    if (k === 'font-size-h3' || k === 'font-h3' || k === 'h3-size') config.fontH3 = v;
                    if (k === 'font-family' || k === 'font') config.fontFamily = v;
                    if (k === 'line-height') config.lineHeight = v;
                    if (k === 'page-padding' || k === 'padding') config.pagePadding = v;
                }
            });
        }
        return { config, markdown: cleanText };
    }

    function preprocessLeftRight(text) {
        return text.replace(
            /<left>([\s\S]*?)<\/left>\s*<right>([\s\S]*?)<\/right>/gi,
            (match, left, right) => {
                const leftHtml = marked.parseInline(left.trim());
                const rightHtml = marked.parseInline(right.trim());
                return `<div class="flex-row"><span>${leftHtml}</span><span>${rightHtml}</span></div>`;
            }
        );
    }

    function applyStyles(config) {
        resumeWrapper.style.setProperty('--resume-width', config.width);
        resumeWrapper.style.setProperty('--hr-margin', config.hrMargin);
        resumeWrapper.style.setProperty('--font-base', config.fontBase);
        resumeWrapper.style.setProperty('--font-h1', config.fontH1);
        resumeWrapper.style.setProperty('--font-h2', config.fontH2);
        resumeWrapper.style.setProperty('--font-h3', config.fontH3);
        resumeWrapper.style.setProperty('--font-family', config.fontFamily);
        resumeWrapper.style.setProperty('--line-height', config.lineHeight);
        resumeWrapper.style.setProperty('--page-padding', config.pagePadding);
    }

    function executeRender() {
        const rawText = editor.value;
        localStorage.setItem(STORAGE_KEY, rawText); // Save progress
        const { config, markdown } = parseConfigAndMarkdown(rawText);
        applyStyles(config);
        const processedMarkdown = preprocessLeftRight(markdown);
        resumeContent.innerHTML = marked.parse(processedMarkdown);
    }

    // Render Button Logic
    renderBtn.addEventListener('click', executeRender);

    // Initial Load Logic
    window.addEventListener('DOMContentLoaded', () => {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
            editor.value = savedData;
            executeRender();
        } else {
            fetch('resume.md')
                .then(response => response.ok ? response.text() : Promise.reject())
                .then(text => {
                    editor.value = text;
                    executeRender();
                })
                .catch(() => {});
        }
    });

    // Handle manual upload to editor
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            editor.value = e.target.result;
            executeRender();
        };
        reader.readAsText(file);
    });

    // Download Markdown File
    downloadMdBtn.addEventListener('click', () => {
        const blob = new Blob([editor.value], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'resume.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    // Trigger native browser PDF printing
    downloadPdfBtn.addEventListener('click', () => {
        window.print();
    });
</script>

</body>
</html>
