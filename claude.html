<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typeset — Markdown to Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1a17;
    --bg:#201c18;
    --bg-panel:#262119;
    --panel-border:rgba(255,255,255,0.09);
    --text-dim:#a89c8b;
    --text-bright:#f4eee3;
    --accent:#c39a56;
    --accent-hover:#d7ad69;
    --accent-ink:#241a0c;
    --paper:#ffffff;
    --paper-ink:#1a1712;
    --paper-muted:#5c5348;
    --paper-rule:#d8d1c2;
    --radius:3px;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --serif:'Book Antiqua',Palatino,'Palatino Linotype',Georgia,'Times New Roman',Times,serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text-bright);
    -webkit-font-smoothing:antialiased;
  }

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:300px;flex-shrink:0;
    background:var(--bg-panel);
    border-right:1px solid var(--panel-border);
    padding:28px 24px 22px;
    display:flex;flex-direction:column;gap:22px;
  }
  .brand{display:flex;gap:10px;align-items:flex-start;}
  .brand-mark{
    width:26px;height:26px;flex-shrink:0;border:1px solid var(--accent);
    border-radius:2px;display:flex;align-items:center;justify-content:center;
    color:var(--accent);font-family:var(--serif);font-size:15px;font-weight:700;
    margin-top:1px;
  }
  .brand h1{font-size:15px;letter-spacing:.2px;margin:0 0 4px;font-weight:600;color:var(--text-bright);}
  .brand p{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5;}

  .field{display:flex;flex-direction:column;gap:8px;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);font-weight:600;}

  .dropzone{
    border:1px dashed rgba(255,255,255,.2);
    border-radius:var(--radius);
    padding:20px 14px;text-align:center;cursor:pointer;display:block;
    transition:border-color .15s ease,background .15s ease;
  }
  .dropzone:hover,.dropzone.dragover{
    border-color:var(--accent);background:rgba(195,154,86,.07);
  }
  .dropzone svg{width:18px;height:18px;color:var(--text-dim);margin-bottom:8px;}
  .dropzone .dz-title{font-size:12.5px;color:var(--text-bright);font-weight:500;margin-bottom:2px;}
  .dropzone .dz-sub{font-size:11px;color:var(--text-dim);}
  .dropzone .dz-file{font-size:11px;color:var(--accent);margin-top:6px;word-break:break-all;}

  .toggle-btn{
    background:none;border:none;color:var(--text-dim);font-size:12px;
    cursor:pointer;padding:0;text-align:left;font-family:var(--sans);
  }
  .toggle-btn:hover{color:var(--text-bright);}

  textarea#mdInput{
    width:100%;min-height:130px;resize:vertical;
    background:#1a1712;border:1px solid var(--panel-border);border-radius:var(--radius);
    color:var(--text-bright);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;line-height:1.5;padding:10px;
  }
  textarea#mdInput:focus{outline:none;border-color:var(--accent);}

  .hr{height:1px;background:var(--panel-border);border:none;margin:0;}

  .sample-link{
    background:none;border:none;color:var(--accent);font-size:12.5px;
    cursor:pointer;padding:0;text-align:left;font-weight:600;font-family:var(--sans);
  }
  .sample-link:hover{color:var(--accent-hover);}

  .sidebar-footer{
    margin-top:auto;font-size:11px;color:var(--text-dim);line-height:1.6;
    padding-top:16px;border-top:1px solid var(--panel-border);
  }

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}

  .toolbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;border-bottom:1px solid var(--panel-border);
    gap:16px;flex-wrap:wrap;
  }
  .source-label{font-size:12.5px;color:var(--text-dim);}
  .source-label span{color:var(--text-bright);font-weight:500;}
  .toolbar-actions{display:flex;align-items:center;gap:10px;}

  select#formatSelect{
    background:var(--bg-panel);color:var(--text-bright);
    border:1px solid var(--panel-border);border-radius:var(--radius);
    font-size:12.5px;padding:7px 10px;font-family:var(--sans);cursor:pointer;
  }

  .btn-primary{
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--radius);
    font-family:var(--sans);font-weight:600;font-size:13px;padding:9px 18px;
    cursor:pointer;transition:background .15s ease;
  }
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-primary:disabled{opacity:.6;cursor:default;}

  .paper-stage{flex:1;overflow:auto;padding:40px 24px 60px;display:flex;justify-content:center;}
  .paper-shadow{
    box-shadow:0 18px 45px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.35);
    height:fit-content;
  }

  .paper{
    width:8.5in;min-height:11in;
    background:var(--paper);color:var(--paper-ink);
    padding:0.75in;font-family:var(--serif);
  }
  [data-format="a4"] .paper{width:8.27in;min-height:11.69in;}

  /* ---------- Resume typography ---------- */
  .resume-name{font-size:22pt;font-weight:700;letter-spacing:.3pt;margin:0 0 3pt;text-align:center;}
  .resume-contact{font-size:9.5pt;color:var(--paper-muted);text-align:center;margin:0 0 16pt;line-height:1.55;}
  .section{margin-bottom:2pt;}
  .section-title{
    font-size:10.5pt;text-transform:uppercase;letter-spacing:1.4pt;font-weight:700;
    border-bottom:.75pt solid var(--paper-rule);padding-bottom:3pt;margin:13pt 0 7pt;
    break-after:avoid;page-break-after:avoid;
  }
  .entry{margin-bottom:9pt;break-inside:avoid;page-break-inside:avoid;}
  .entry-head{display:flex;}
  .entry-title{font-size:10.5pt;font-weight:700;margin:0;}
  .entry-meta{
    display:flex;justify-content:space-between;gap:10pt;
    font-size:9.5pt;color:var(--paper-muted);margin:1pt 0 4pt;
  }
  .entry-meta span:first-child{font-style:italic;}
  .entry-meta span:last-child{white-space:nowrap;}
  .paper p{font-size:10pt;line-height:1.48;margin:4pt 0;}
  .paper ul{list-style:none;margin:4pt 0 0;padding:0;}
  .paper li{position:relative;padding-left:13pt;margin-bottom:3pt;font-size:10pt;line-height:1.45;}
  .paper li::before{content:"•";position:absolute;left:1pt;color:var(--paper-muted);}
  .paper li ul{margin-top:3pt;}
  .paper li li::before{content:"–";}
  .paper hr{border:none;border-top:.75pt solid var(--paper-rule);margin:10pt 0;}
  .paper a{color:inherit;text-decoration:underline;text-decoration-color:var(--paper-rule);text-underline-offset:2pt;}
  .paper strong{font-weight:700;}
  .paper em{font-style:italic;}
  .paper code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9pt;
    background:#f1efe8;padding:1pt 3pt;border-radius:2pt;
  }
  .sub-title{font-size:10pt;font-weight:700;color:var(--paper-muted);margin:6pt 0 2pt;}
  .resume-name,.resume-contact{break-inside:avoid;page-break-inside:avoid;}
  .empty-hint{color:var(--paper-muted);font-style:italic;text-align:center;margin-top:38pt;font-size:10.5pt;}

  @media (max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--panel-border);}
    .paper-stage{padding:24px 16px 40px;}
  }

  @media print{
    body *{visibility:hidden;}
    .paper,.paper *{visibility:visible;}
    .paper{position:absolute;top:0;left:0;width:100%;min-height:auto;padding:0.6in;}
    .paper-shadow{box-shadow:none;}
    @page{size:letter;margin:0;}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">T</div>
      <div>
        <h1>Typeset</h1>
        <p>Turn a markdown file into a clean, print-ready resume.</p>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Markdown file</span>
      <label class="dropzone" id="dropzone" for="fileInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7 8m5-5l5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        <div class="dz-title">Drop a .md file here</div>
        <div class="dz-sub">or click to browse</div>
        <div class="dz-file" id="dzFileName"></div>
      </label>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>
    </div>

    <div class="field">
      <button class="toggle-btn" id="togglePaste" type="button" aria-expanded="false">Paste markdown instead ▾</button>
      <div id="pasteWrap" style="display:none;">
        <textarea id="mdInput" spellcheck="false" placeholder="# Your Name&#10;you@email.com | City, State&#10;&#10;## Experience&#10;..."></textarea>
      </div>
    </div>

    <hr class="hr">

    <button class="sample-link" id="loadSample" type="button">Load a sample resume</button>

    <div class="sidebar-footer">
      Everything runs locally in your browser. Your file is never uploaded anywhere.
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="source-label">Previewing: <span id="sourceLabel">sample resume</span></div>
      <div class="toolbar-actions">
        <select id="formatSelect" aria-label="Page size">
          <option value="letter" selected>US Letter</option>
          <option value="a4">A4</option>
        </select>
        <button class="btn-primary" id="downloadBtn" type="button">Download PDF</button>
      </div>
    </div>

    <div class="paper-stage" id="paperStage">
      <div class="paper-shadow">
        <div class="paper" id="resumePaper">
          <div id="resumeContent"></div>
        </div>
      </div>
    </div>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
  onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js';document.head.appendChild(s);"></script>

<script>
/* =========================================================
   Resume-flavored markdown parser
   ========================================================= */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderInline(text){
  let s = escapeHtml(text);
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,t,u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/(^|[^\w])_([^_]+)_($|[^\w])/g, '$1<em>$2</em>$3');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}

function blockify(text){
  const rawLines = text.replace(/\r\n/g,'\n').split('\n');
  const blocks = [];
  let i = 0;

  while(i < rawLines.length){
    const line = rawLines[i];
    if(line.trim() === ''){ i++; continue; }

    let m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      blocks.push({ type:'h'+m[1].length, text:m[2].trim() });
      i++; continue;
    }

    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line.trim())){
      blocks.push({ type:'hr' });
      i++; continue;
    }

    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const items = [];
      while(i < rawLines.length){
        const l = rawLines[i];
        if(l.trim() === '') break;
        const lm = l.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if(!lm) break;
        const indent = lm[1].replace(/\t/g,'  ').length;
        const level = indent >= 2 ? 1 : 0;
        items.push({ level, text: lm[3].trim() });
        i++;
      }
      blocks.push({ type:'list', items });
      continue;
    }

    const pLines = [];
    while(
      i < rawLines.length &&
      rawLines[i].trim() !== '' &&
      !/^(#{1,6})\s+/.test(rawLines[i]) &&
      !/^\s*([-*+]|\d+\.)\s+/.test(rawLines[i]) &&
      !/^(-{3,}|\*{3,}|_{3,})\s*$/.test(rawLines[i].trim())
    ){
      pLines.push(rawLines[i].trim());
      i++;
    }
    blocks.push({ type:'p', lines:pLines, text:pLines.join(' ') });
  }
  return blocks;
}

function renderList(items){
  let html = '<ul>';
  let liOpen = false;
  let i = 0;
  while(i < items.length){
    const it = items[i];
    if(it.level === 0){
      if(liOpen) html += '</li>';
      html += `<li>${renderInline(it.text)}`;
      liOpen = true;
      i++;
      if(items[i] && items[i].level === 1){
        html += '<ul>';
        while(items[i] && items[i].level === 1){
          html += `<li>${renderInline(items[i].text)}</li>`;
          i++;
        }
        html += '</ul>';
      }
    } else {
      html += `<li>${renderInline(it.text)}</li>`;
      i++;
    }
  }
  if(liOpen) html += '</li>';
  html += '</ul>';
  return html;
}

function renderParagraphInner(lines){
  return lines.map(renderInline).join('<br>');
}

function renderBlock(b){
  switch(b.type){
    case 'p': return `<p>${renderParagraphInner(b.lines)}</p>`;
    case 'list': return renderList(b.items);
    case 'hr': return '<hr/>';
    case 'h4': return `<h4 class="sub-title">${renderInline(b.text)}</h4>`;
    case 'h5':
    case 'h6': return `<p class="sub-title">${renderInline(b.text)}</p>`;
    default: return '';
  }
}

function parseResume(md){
  const blocks = blockify(md);
  let i = 0;
  let html = '';
  let nameRendered = false;
  let inSection = false;

  if(blocks[0] && blocks[0].type === 'p'){
    const firstLine = blocks[0].lines[0];
    const looksLikeContact = /[@|]/.test(firstLine) || firstLine.length > 60;
    if(!looksLikeContact){
      const rest = blocks[0].lines.slice(1);
      const replacement = [{ type:'h1', text:firstLine }];
      if(rest.length) replacement.push({ type:'p', lines:rest, text:rest.join(' ') });
      blocks.splice(0,1,...replacement);
    }
  }

  while(i < blocks.length){
    const b = blocks[i];

    if(b.type === 'h1' && !nameRendered){
      html += `<h1 class="resume-name">${renderInline(b.text)}</h1>`;
      nameRendered = true;
      i++;
      if(blocks[i] && blocks[i].type === 'p'){
        html += `<p class="resume-contact">${renderParagraphInner(blocks[i].lines)}</p>`;
        i++;
      }
      continue;
    }

    if(b.type === 'h2'){
      if(inSection) html += '</div>';
      html += `<div class="section"><h2 class="section-title">${renderInline(b.text)}</h2>`;
      inSection = true;
      i++;
      continue;
    }

    if(b.type === 'h3'){
      html += `<div class="entry"><div class="entry-head"><h3 class="entry-title">${renderInline(b.text)}</h3>`;
      i++;

      if(blocks[i] && blocks[i].type === 'p' && blocks[i].lines.length === 1){
        const metaText = blocks[i].text;
        if(metaText.includes('|')){
          const idx = metaText.lastIndexOf('|');
          const left = metaText.slice(0,idx).trim();
          const right = metaText.slice(idx+1).trim();
          html += `</div><p class="entry-meta"><span>${renderInline(left)}</span><span>${renderInline(right)}</span></p>`;
        } else {
          html += `</div><p class="entry-meta"><span>${renderInline(metaText)}</span></p>`;
        }
        i++;
      } else {
        html += '</div>';
      }

      while(blocks[i] && blocks[i].type !== 'h2' && blocks[i].type !== 'h3'){
        html += renderBlock(blocks[i]);
        i++;
      }
      html += '</div>';
      continue;
    }

    html += renderBlock(b);
    i++;
  }

  if(inSection) html += '</div>';
  return html;
}

/* =========================================================
   App wiring
   ========================================================= */
const SAMPLE_MD = `# Jordan Avery

jordan.avery@email.com  |  (555) 123-4567  |  San Francisco, CA  |  linkedin.com/in/jordanavery

## Experience

### Senior Product Designer
Novus Health | San Francisco, CA | Jan 2022 – Present

- Led the redesign of the patient intake flow, cutting completion time by 38%
- Managed a team of three designers across four concurrent product lines
- Partnered with engineering to launch a shared component library
  - Adopted by six product teams within the first quarter

### Product Designer
Fieldstone Labs | Remote | Jun 2019 – Dec 2021

- Shipped 12 major features from concept to launch
- Ran quarterly usability studies with 50+ participants
- Reduced onboarding drop-off by 22% through iterative testing

## Education

### B.S. in Human-Computer Interaction
University of Washington | Sep 2015 – Jun 2019

## Skills

**Design:** Figma, Sketch, prototyping, design systems
**Research:** usability testing, survey design, A/B testing
**Tools:** HTML/CSS, Git, Notion

## Projects

**Fieldnotes** — a lightweight journaling app built with React and SQLite, used by 2,000+ people.

---

*References available upon request.*
`;

(function(){
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const dzFileName = document.getElementById('dzFileName');
  const textarea = document.getElementById('mdInput');
  const togglePaste = document.getElementById('togglePaste');
  const pasteWrap = document.getElementById('pasteWrap');
  const sampleBtn = document.getElementById('loadSample');
  const resumeContent = document.getElementById('resumeContent');
  const sourceLabel = document.getElementById('sourceLabel');
  const downloadBtn = document.getElementById('downloadBtn');
  const formatSelect = document.getElementById('formatSelect');
  const resumePaper = document.getElementById('resumePaper');

  function render(md, sourceName){
    let html;
    try{
      html = parseResume(md || '');
    }catch(e){
      console.error('Parse error', e);
      html = '<p class="empty-hint">Could not parse this file. Check the markdown formatting and try again.</p>';
    }
    resumeContent.innerHTML = html || '<p class="empty-hint">Upload or paste a markdown file to preview your resume here.</p>';
    if(sourceName) sourceLabel.textContent = sourceName;
  }

  function handleFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const text = e.target.result;
      textarea.value = text;
      dzFileName.textContent = file.name;
      render(text, file.name);
    };
    reader.onerror = () => {
      render('', 'error reading file');
      resumeContent.innerHTML = '<p class="empty-hint">Could not read that file. Please try again.</p>';
    };
    reader.readAsText(file);
  }

  fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

  ['dragenter','dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => {
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, (e) => {
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.remove('dragover');
  }));
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) handleFile(file);
  });

  togglePaste.addEventListener('click', () => {
    const isHidden = pasteWrap.style.display === 'none';
    pasteWrap.style.display = isHidden ? 'block' : 'none';
    togglePaste.setAttribute('aria-expanded', String(isHidden));
    togglePaste.textContent = isHidden ? 'Hide markdown text ▴' : 'Paste markdown instead ▾';
    if(isHidden) textarea.focus();
  });

  let debounceTimer;
  textarea.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      dzFileName.textContent = '';
      render(textarea.value, 'pasted markdown');
    }, 250);
  });

  sampleBtn.addEventListener('click', () => {
    textarea.value = SAMPLE_MD;
    dzFileName.textContent = '';
    render(SAMPLE_MD, 'sample resume');
  });

  formatSelect.addEventListener('change', () => {
    document.documentElement.setAttribute('data-format', formatSelect.value);
  });

  downloadBtn.addEventListener('click', () => {
    const original = downloadBtn.textContent;

    if(typeof html2pdf === 'undefined'){
      window.print();
      return;
    }

    downloadBtn.textContent = 'Preparing PDF…';
    downloadBtn.disabled = true;

    const format = formatSelect.value === 'a4' ? 'a4' : 'letter';
    const nameEl = resumeContent.querySelector('.resume-name');
    const base = nameEl
      ? nameEl.textContent.trim().replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'')
      : 'resume';

    const opt = {
      margin: 0,
      filename: (base || 'resume') + '.pdf',
      image: { type:'jpeg', quality:0.98 },
      html2canvas: { scale:3, useCORS:true, backgroundColor:'#ffffff' },
      jsPDF: { unit:'in', format:format, orientation:'portrait' },
      pagebreak: { mode:['css','avoid-all'] }
    };

    let done = false;
    const reset = () => {
      if(done) return;
      done = true;
      downloadBtn.textContent = original;
      downloadBtn.disabled = false;
    };

    html2pdf().set(opt).from(resumePaper).save().then(reset).catch((err) => {
      console.error(err);
      reset();
      window.print();
    });

    setTimeout(reset, 9000);
  });

  // initial state: load the sample so the tool is never blank
  textarea.value = SAMPLE_MD;
  render(SAMPLE_MD, 'sample resume');
})();
</script>
</body>
</html>
